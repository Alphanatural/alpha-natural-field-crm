<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f45">
<title>ALPHA NATURAL FIELD CRM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e7ece9;font-family:Arial,sans-serif;color:#17201b}.app{max-width:470px;margin:auto;min-height:100vh;background:#f6f8f7}header{background:#087f45;color:#fff;padding:18px 16px 20px;border-radius:0 0 20px 20px;position:sticky;top:0;z-index:3}header h1{margin:0;font-size:21px}header p{margin:5px 0 0;font-size:12px;opacity:.88}main{padding:15px 13px 90px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 9px #0000000b}h2{font-size:18px;margin:3px 0 14px}h3{font-size:14px;margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{font-size:25px;display:block}.muted{font-size:12px;color:#6c7771}button{border:0;border-radius:10px;padding:11px 13px;font-weight:bold;cursor:pointer;background:#087f45;color:#fff}.full{width:100%;margin:6px 0}.secondary{background:#e7f1eb;color:#087f45}.danger{background:#fff0f0;color:#b42318}label{display:block;font-size:12px;font-weight:bold;margin:11px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d5ddd8;border-radius:9px;background:#fff;font-size:14px}textarea{min-height:76px;resize:vertical}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.item{padding:11px 0;border-bottom:1px solid #edf0ee}.item:last-child{border-bottom:0}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#e5f5ec;color:#087f45;font-size:11px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:470px;background:#fff;border-top:1px solid #dfe5e1;display:flex;z-index:5}.nav button{background:none;color:#59645e;border-radius:0;flex:1;padding:9px 2px;font-size:10px}.nav button.active{color:#087f45}.small{padding:7px 9px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}.stats .stat{background:#fff;border-radius:14px;padding:13px;box-shadow:0 2px 9px #0000000b}.stats .stat b{font-size:22px;display:block;margin-bottom:4px}.stats .stat span{font-size:11px;color:#6c7771}.card table{width:100%;border-collapse:collapse;font-size:12px}.card th,.card td{padding:8px 6px;border-bottom:1px solid #edf0ee;text-align:left;vertical-align:top}.card th{font-size:11px;color:#59645e}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid2>div{min-width:0}.empty{padding:20px;text-align:center;color:#758079;font-size:13px}.check{font-size:48px;text-align:center;color:#087f45}.center{text-align:center}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap;background:#e7f1eb;color:#087f45}.tabs button.on{background:#087f45;color:white}.prev{border:1px solid #cfe6d7;background:#f6faf7}.history-card{border-left:4px solid #087f45;padding-left:10px}.hint{font-size:11px;color:#68736d;background:#f1f5f3;padding:9px;border-radius:9px;margin-top:7px}.search{margin-bottom:8px}
</style>
</head>
<body>
<div class="app">
<header><h1>ALPHA NATURAL FIELD CRM</h1><p>Doctor • Hospital/Clinic • Visit • Product • Sample • Follow-up</p></header>
<main id="main"></main>
<nav class="nav">
<button id="navhome" onclick="home()">⌂<br>Home</button>
<button id="navmaster" onclick="masters()">☷<br>Masters</button>
<button id="navvisit" onclick="newVisit()">＋<br>Visit</button>
<button id="navfollow" onclick="followups()">◷<br>Follow-up</button>
<button id="navreports" onclick="reports()">▥<br>Reports</button>
</nav>
</div>
<!-- Location save/edit fix: visit and hospital GPS coordinates persist in localStorage. -->
<script>
'use strict';
const KEY='mrft_v3';
const DEFAULT_DB={districts:['Kozhikode','Kannur','Wayanad','Kasaragod'],routes:[],areas:[],hospitals:[],doctors:[],products:[],samples:[],visits:[],followups:[]};
let db=loadDB();
function clone(x){return JSON.parse(JSON.stringify(x));}
function uid(prefix){return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);}
function loadDB(){
  let x=null;try{x=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  x=x&&typeof x==='object'?x:clone(DEFAULT_DB);
  x.districts=Array.isArray(x.districts)?x.districts:[...DEFAULT_DB.districts];
  ['routes','areas','hospitals','doctors','products','samples','visits','followups'].forEach(k=>{if(!Array.isArray(x[k]))x[k]=[]});
  x.routes=x.routes.map(r=>typeof r==='string'?{id:uid('r'),name:r,district:''}:r).filter(r=>r&&r.name);
  x.areas=x.areas.map(a=>typeof a==='string'?{id:uid('a'),name:a,district:'',route:''}:a).filter(a=>a&&a.name);
  x.hospitals.forEach(h=>{
    if(h.route&&!x.routes.some(r=>r.name===h.route&&(!r.district||r.district===h.district)))x.routes.push({id:uid('r'),name:h.route,district:h.district||''});
    if(h.area&&!x.areas.some(a=>a.name===h.area&&a.route===h.route&&a.district===h.district))x.areas.push({id:uid('a'),name:h.area,district:h.district||'',route:h.route||''});
  });
  return x;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Data save failed. Please allow browser storage for this file.');return false}}
function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function el(id){return document.getElementById(id)}
function nav(id){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));el(id)?.classList.add('active')}
function today(){return new Date().toISOString().slice(0,10)}
function uniq(a){return [...new Set(a.filter(Boolean))]}
function home(){
 nav('navhome');const t=today(),todayCount=db.visits.filter(v=>v.date===t).length,due=db.visits.filter(v=>v.next&&v.next<=t).length;
 el('main').innerHTML=`<h2>Dashboard</h2><div class="grid"><div class="card stat"><b>${todayCount}</b><span>Today's Visits</span></div><div class="card stat"><b>${due}</b><span>Follow-ups Due</span></div><div class="card stat"><b>${db.doctors.length}</b><span>Doctors</span></div><div class="card stat"><b>${db.products.length}</b><span>Products</span></div></div><button class="full" onclick="newVisit()">＋ New Visit</button><button class="full secondary" onclick="masters('hospitals')">＋ Add Hospital / Clinic</button><div class="card"><div class="row"><h3>Recent Visits</h3><span class="pill">${db.visits.length}</span></div>${db.visits.slice().sort(sortVisits).slice(0,5).map(v=>`<div class="item" style="cursor:pointer" onclick="editVisit(${v.id})"><div class="row"><span><b>${esc(v.doctor)}</b><br><span class="muted">${esc(v.hospital)} • ${esc(v.route)} • ${esc(v.area)}<br>${esc(v.date)} ${esc(v.time||'')}</span></span><button class="small secondary" onclick="event.stopPropagation();editVisit(${v.id})">Open / Edit</button></div></div>`).join('')||'<div class="empty">No visits recorded yet.</div>'}</div><div class="card"><div class="row"><h3>Data</h3><button class="small secondary" onclick="backup()">Backup</button></div><div class="muted">Data is stored locally in this browser.</div></div>`;
}
function sortVisits(a,b){return (String(b.date||'')+String(b.time||'')).localeCompare(String(a.date||'')+String(a.time||''))}
function masters(tab='products'){
 nav('navmaster');el('main').innerHTML=`<h2>Master Management</h2><div class="card hint">Recommended order: District → Route → Area → Hospital / Clinic → Doctor.</div><div class="tabs"><button class="${tab==='products'?'on':''}" onclick="masters('products')">Products</button><button class="${tab==='districts'?'on':''}" onclick="masters('districts')">Districts</button><button class="${tab==='routes'?'on':''}" onclick="masters('routes')">Routes / Areas</button><button class="${tab==='hospitals'?'on':''}" onclick="masters('hospitals')">Hospitals</button><button class="${tab==='doctors'?'on':''}" onclick="masters('doctors')">Doctors</button><button class="${tab==='samples'?'on':''}" onclick="masters('samples')">Samples</button></div>${masterBody(tab)}`;
 if(tab==='products')renderProducts('');if(tab==='samples')renderSamples('');if(tab==='doctors')renderDoctors('');
}
function masterBody(tab){
 if(tab==='products')return `<div class="card"><div class="row"><h3>Product Master</h3><button class="small" onclick="addProduct()">＋ Add Product</button></div><input class="search" id="productSearch" placeholder="Search product..." oninput="renderProducts(this.value)"><div id="productsList"></div></div>`;
 if(tab==='samples')return `<div class="card"><div class="row"><h3>Sample Master</h3><button class="small" onclick="addSample()">＋ Add Sample</button></div><input class="search" id="sampleSearch" placeholder="Search sample..." oninput="renderSamples(this.value)"><div id="samplesList"></div></div>`;

 if(tab==='districts')return `<div class="card"><div class="row"><h3>District Master</h3><button class="small" onclick="addDistrict()">＋ Add</button></div>${db.districts.map((d,i)=>`<div class="item row"><span>${esc(d)}</span><span><button class="small" onclick="editDistrict(${i})">Edit</button> <button class="small danger" onclick="deleteDistrict(${i})">Delete</button></span></div>`).join('')}</div>`;
 if(tab==='routes')return `<div class="card"><div class="row"><h3>Route Master</h3><button class="small" onclick="addRoute()">＋ Add Route</button></div>${db.routes.map(r=>`<div class="item row"><span><b>${esc(r.name)}</b><br><span class="muted">${esc(r.district||'All districts')}</span></span><span><button class="small" onclick="editRoute('${r.id}')">Edit</button> <button class="small danger" onclick="deleteRoute('${r.id}')">Delete</button></span></div>`).join('')||'<div class="empty">No routes yet.</div>'}</div><div class="card"><div class="row"><h3>Area Master</h3><button class="small" onclick="addArea()">＋ Add Area</button></div>${db.areas.map(a=>`<div class="item row"><span><b>${esc(a.name)}</b><br><span class="muted">${esc(a.route||'All routes')} • ${esc(a.district||'All districts')}</span></span><span><button class="small" onclick="editArea('${a.id}')">Edit</button> <button class="small danger" onclick="deleteArea('${a.id}')">Delete</button></span></div>`).join('')||'<div class="empty">No areas yet.</div>'}</div>`;
 if(tab==='hospitals')return `<button class="full" onclick="addHospital()">＋ Add Hospital / Clinic</button><div class="card">${db.hospitals.map(h=>`<div class="item"><div class="row"><span><b>${esc(h.name)}</b><br><span class="muted">${esc(h.type)} • ${esc(h.route)} • ${esc(h.area||'—')} • ${esc(h.district)}</span></span><span><button class="small" onclick="editHospital(${h.id})">Edit</button> <button class="small danger" onclick="deleteHospital(${h.id})">Delete</button></span></div><div class="muted">${db.doctors.filter(d=>String(d.hospitalId)===String(h.id)).length} doctor(s)</div></div>`).join('')||'<div class="empty">No hospitals/clinics yet.</div>'}</div>`;
 return `<div class="card"><div class="row"><h3>Doctor Master</h3><button class="small" onclick="addDoctor()">＋ Add Doctor</button></div><input class="search" id="doctorSearch" placeholder="Search doctor / hospital / route..." oninput="renderDoctors(this.value)"><div id="doctorsList"></div></div>`;
}
function addProduct(id=null){const p=id!=null?db.products.find(x=>String(x.id)===String(id)):null;el('main').innerHTML=`<h2>${p?'Edit Product':'Add Product'}</h2><div class="card"><label>Product Name *</label><input id="pn" value="${esc(p?.name||'')}" placeholder="Product name"><label>Product Code</label><input id="pc" value="${esc(p?.code||'')}" placeholder="Optional code"><label>Company / Brand</label><input id="pb" value="${esc(p?.company||'')}" placeholder="Optional"><label>Category</label><input id="pcat" value="${esc(p?.category||'')}" placeholder="Tablet / Capsule / Syrup / etc."><label>Pack / Unit</label><input id="ppack" value="${esc(p?.pack||'')}" placeholder="e.g. 10 capsules"><button class="full" onclick="${p?`updateProduct(${p.id})`:'saveProduct()'}">${p?'Update Product':'Save Product'}</button><button class="full secondary" onclick="masters('products')">Cancel</button></div>`}
function saveProduct(){const n=el('pn').value.trim();if(!n)return alert('Product name is required.');if(db.products.some(p=>p.name.toLowerCase()===n.toLowerCase()))return alert('Product already exists.');db.products.push({id:Date.now(),name:n,code:el('pc').value.trim(),company:el('pb').value.trim(),category:el('pcat').value.trim(),pack:el('ppack').value.trim()});if(save())masters('products')}
function updateProduct(id){const p=db.products.find(x=>x.id===id),n=el('pn').value.trim();if(!p||!n)return alert('Product name is required.');if(db.products.some(x=>x.id!==id&&x.name.toLowerCase()===n.toLowerCase()))return alert('Product already exists.');Object.assign(p,{name:n,code:el('pc').value.trim(),company:el('pb').value.trim(),category:el('pcat').value.trim(),pack:el('ppack').value.trim()});if(save())masters('products')}
function renderProducts(q=''){const b=el('productsList');if(!b)return;q=q.toLowerCase();const a=db.products.filter(x=>String(x.name).toLowerCase().includes(q));b.innerHTML=a.map(p=>`<div class="item row"><span><b>${esc(p.name)}</b><br><span class="muted">${esc(p.code||'')} ${p.company?'• '+esc(p.company):''}</span></span><span><button class="small" onclick="addProduct(${p.id})">Edit</button> <button class="small danger" onclick="deleteProduct(${p.id})">Delete</button></span></div>`).join('')||'<div class="empty">No products. Add your first product.</div>'}
function addSample(id=null){
 const s=id!=null?db.samples.find(x=>String(x.id)===String(id)):null;
 const n=prompt(s?'Edit sample name:':'Sample name:',s?.name||'');
 if(!n||!n.trim())return;
 const name=n.trim();
 if(db.samples.some(x=>x.id!==s?.id&&x.name.toLowerCase()===name.toLowerCase()))return alert('Sample already exists.');
 if(s)s.name=name;else db.samples.push({id:Date.now(),name});
 if(save())masters('samples');
}
function renderSamples(q=''){
 const b=el('samplesList');if(!b)return;q=q.toLowerCase();
 const a=db.samples.filter(x=>x.name.toLowerCase().includes(q));
 b.innerHTML=a.map(s=>`<div class="item row"><span><b>${esc(s.name)}</b></span><span><button class="small" onclick="addSample(${s.id})">Edit</button> <button class="small danger" onclick="deleteSample(${s.id})">Delete</button></span></div>`).join('')||'<div class="empty">No samples. Add your first sample.</div>';
}
function deleteSample(id){
 const s=db.samples.find(x=>x.id===id);if(s&&confirm('Delete sample "'+s.name+'"? Existing visit records remain.')){db.samples=db.samples.filter(x=>x.id!==id);save();masters('samples')}
}
function deleteProduct(id){const p=db.products.find(x=>x.id===id);if(p&&confirm('Delete product "'+p.name+'"? Existing visit records remain.')){db.products=db.products.filter(x=>x.id!==id);save();masters('products')}}
function addDistrict(){const n=prompt('District name:');if(!n||!n.trim())return;const name=n.trim();if(db.districts.some(d=>d.toLowerCase()===name.toLowerCase()))return alert('District already exists.');db.districts.push(name);if(save())masters('districts')}
function editDistrict(i){const old=db.districts[i],n=prompt('Edit district:',old);if(!n||!n.trim())return;const name=n.trim();if(db.districts.some((d,j)=>j!==i&&d.toLowerCase()===name.toLowerCase()))return alert('District already exists.');db.districts[i]=name;db.routes.forEach(r=>{if(r.district===old)r.district=name});db.areas.forEach(a=>{if(a.district===old)a.district=name});db.hospitals.forEach(h=>{if(h.district===old)h.district=name});db.doctors.forEach(d=>{if(d.district===old)d.district=name});if(save())masters('districts')}
function deleteDistrict(i){const n=db.districts[i];if(db.hospitals.some(h=>h.district===n))return alert('This district has hospitals/clinics. Remove or move them first.');if(confirm('Delete '+n+'?')){db.districts.splice(i,1);db.routes=db.routes.filter(r=>r.district!==n);db.areas=db.areas.filter(a=>a.district!==n);if(save())masters('districts')}}
function chooseFromList(title,list,defaultValue){const v=prompt(title+'\n\n'+list.join('\n'),defaultValue||list[0]||'');return v?v.trim():''}
function addRoute(){if(!db.districts.length)return alert('Please add a District first.');const district=chooseFromList('District:',db.districts,db.districts[0]);if(!db.districts.includes(district))return alert('Select an existing district.');const name=prompt('Route name:');if(!name||!name.trim())return;const n=name.trim();if(db.routes.some(r=>r.name.toLowerCase()===n.toLowerCase()&&r.district===district))return alert('This route already exists in the selected district.');db.routes.push({id:uid('r'),name:n,district});if(save())masters('routes')}
function editRoute(id){const r=db.routes.find(x=>x.id===id);if(!r)return;const n=prompt('Edit route:',r.name);if(!n||!n.trim())return;const name=n.trim();if(db.routes.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()&&x.district===r.district))return alert('This route already exists.');const old=r.name;r.name=name;db.areas.forEach(a=>{if(a.route===old&&a.district===r.district)a.route=name});db.hospitals.forEach(h=>{if(h.route===old&&h.district===r.district)h.route=name});db.doctors.forEach(d=>{if(d.route===old&&d.district===r.district)d.route=name});db.visits.forEach(v=>{if(v.route===old&&v.district===r.district)v.route=name});if(save())masters('routes')}
function deleteRoute(id){const r=db.routes.find(x=>x.id===id);if(!r)return;if(db.hospitals.some(h=>h.route===r.name&&h.district===r.district))return alert('This route is used by a hospital/clinic. Move/delete those hospitals first.');if(confirm('Delete route "'+r.name+'"?')){db.routes=db.routes.filter(x=>x.id!==id);db.areas=db.areas.filter(a=>!(a.route===r.name&&a.district===r.district));if(save())masters('routes')}}
function addArea(){if(!db.districts.length)return alert('Please add a District first.');const district=chooseFromList('District:',db.districts,db.districts[0]);const rs=db.routes.filter(r=>r.district===district);if(!rs.length)return alert('No route exists in this district. Add a route first.');const route=chooseFromList('Route:',rs.map(r=>r.name),rs[0].name);if(!rs.some(r=>r.name===route))return alert('Select an existing route.');const name=prompt('Area / Locality name:');if(!name||!name.trim())return;const n=name.trim();if(db.areas.some(a=>a.name.toLowerCase()===n.toLowerCase()&&a.district===district&&a.route===route))return alert('This area already exists.');db.areas.push({id:uid('a'),name:n,district,route});if(save())masters('routes')}
function editArea(id){const a=db.areas.find(x=>x.id===id);if(!a)return;const n=prompt('Edit area:',a.name);if(!n||!n.trim())return;const name=n.trim();if(db.areas.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()&&x.district===a.district&&x.route===a.route))return alert('This area already exists.');const old=a.name;a.name=name;db.hospitals.forEach(h=>{if(h.area===old&&h.route===a.route&&h.district===a.district)h.area=name});db.visits.forEach(v=>{if(v.area===old&&v.route===a.route&&v.district===a.district)v.area=name});if(save())masters('routes')}
function deleteArea(id){const a=db.areas.find(x=>x.id===id);if(!a)return;if(db.hospitals.some(h=>h.area===a.name&&h.route===a.route&&h.district===a.district))return alert('This area is used by a hospital/clinic. Move those hospitals first.');if(confirm('Delete area "'+a.name+'"?')){db.areas=db.areas.filter(x=>x.id!==id);if(save())masters('routes')}}
function addHospital(id=null){const h=id!=null?db.hospitals.find(x=>String(x.id)===String(id)):null;pendingLocation.hospital=h&&h.lat&&h.lng?{lat:Number(h.lat),lng:Number(h.lng)}:null;el('main').innerHTML=`<h2>${h?'Edit Hospital / Clinic':'Add Hospital / Clinic'}</h2><div class="card"><label>District *</label><select id="hd">${db.districts.map(d=>`<option value="${esc(d)}" ${h?.district===d?'selected':''}>${esc(d)}</option>`).join('')}</select><label>Route *</label><select id="hr"></select><label>Area / Locality</label><select id="haArea"></select><label>Hospital / Clinic Name *</label><input id="hn" value="${esc(h?.name||'')}" placeholder="Name"><label>Type</label><select id="ht"><option ${h?.type==='Hospital'?'selected':''}>Hospital</option><option ${h?.type==='Clinic'?'selected':''}>Clinic</option><option ${h?.type==='Medical Centre'?'selected':''}>Medical Centre</option></select><label>Address</label><textarea id="haddr">${esc(h?.address||'')}</textarea><label>Phone</label><input id="hp" value="${esc(h?.phone||'')}" type="tel"><button type="button" class="full secondary" onclick="captureLocation('hospital')">📍 Capture Current Location</button><div id="hospitalLocation" class="muted">${h?.lat&&h?.lng?`Saved location: ${esc(h.lat)}, ${esc(h.lng)}`:''}</div><button class="full" onclick="${h?`updateHospital(${h.id})`:'saveHospital()'}">${h?'Update Hospital / Clinic':'Save Hospital / Clinic'}</button><button class="full secondary" onclick="masters('hospitals')">Cancel</button></div>`;
 const districtEl=el('hd'),routeEl=el('hr'),areaEl=el('haArea');
 function loadRoutes(){const d=districtEl.value;const routes=uniq([...db.routes.filter(r=>r.district===d||!r.district).map(r=>r.name),...db.hospitals.filter(x=>x.district===d).map(x=>x.route)]);routeEl.innerHTML='<option value="">Select Route</option>'+routes.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('');if(h&&h.district===d&&routes.includes(h.route))routeEl.value=h.route;loadAreas()}
 function loadAreas(){const d=districtEl.value,r=routeEl.value;const areas=uniq(db.areas.filter(a=>(a.district===d||!a.district)&&(!r||a.route===r)).map(a=>a.name));areaEl.innerHTML='<option value="">Select Area</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');if(h&&h.district===d&&h.route===r&&areas.includes(h.area))areaEl.value=h.area}
 districtEl.addEventListener('change',loadRoutes);routeEl.addEventListener('change',loadAreas);loadRoutes();
}
function saveHospital(){const name=el('hn').value.trim(),district=el('hd').value,route=el('hr').value,area=el('haArea').value;if(!name||!route)return alert('Hospital/Clinic name and Route are required.');const loc=pendingLocation.hospital||{};const id=Date.now();db.hospitals.push({id,name,type:el('ht').value,district,route,area,address:el('haddr').value.trim(),phone:el('hp').value.trim(),lat:loc.lat||'',lng:loc.lng||''});if(!db.routes.some(r=>r.name===route&&r.district===district))db.routes.push({id:uid('r'),name:route,district});if(area&&!db.areas.some(a=>a.name===area&&a.route===route&&a.district===district))db.areas.push({id:uid('a'),name:area,district,route});if(save())masters('hospitals')}

function parseSamples(text){return String(text||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)\s*-\s*(\d+)$/);return{product:(m?m[1]:x).trim(),qty:m?Math.max(1,+m[2]):1}})}
function normalizeSamples(samples){if(!Array.isArray(samples))return[];return samples.map(x=>typeof x==='string'?{product:x,qty:1}:{product:String(x.product||''),qty:Number(x.qty)||1}).filter(x=>x.product)}

 const box=el('previousDoctorVisits'),doctorId=el('vdoc')?.value;if(!box)return;if(!doctorId){box.innerHTML='';return}const d=db.doctors.find(x=>String(x.id)===String(doctorId));if(!d){box.innerHTML='';return}

let pendingLocation={visit:null,hospital:null};
function captureLocation(kind){
 if(!navigator.geolocation)return alert('Location is not supported by this browser.');
 const box=el(kind==='visit'?'visitLocation':'hospitalLocation');
 if(box)box.textContent='Getting current location…';
 navigator.geolocation.getCurrentPosition(p=>{
   pendingLocation[kind]={lat:p.coords.latitude,lng:p.coords.longitude};
   if(box)box.innerHTML='Location captured: '+p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6)+' <a href="https://www.google.com/maps?q='+encodeURIComponent(p.coords.latitude+','+p.coords.longitude)+'" target="_blank" rel="noopener">View Map</a>';
 },err=>{
   if(box)box.textContent='';
   const msg=err&&err.code===1?'Please allow location permission in your browser settings.':err&&err.code===3?'Location request timed out. Please try again.':'Unable to get current location. Please try again.';
   alert(msg);
 },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

 return [...document.querySelectorAll('.sampleCheck:checked')].map(c=>{
   const q=Number(document.querySelector(`.sampleQty[data-sample="${CSS.escape(c.value)}"]`)?.value||0);
   return {product:c.value,qty:q>0?q:1};
 });
}

function deleteVisit(id,docId){if(confirm('Delete this visit?')){db.visits=db.visits.filter(v=>v.id!==id);if(save())doctorHistory(docId)}}
function followups(){nav('navfollow');const t=today(),a=db.visits.filter(v=>v.next).sort((x,y)=>String(x.next).localeCompare(String(y.next)));el('main').innerHTML=`<h2>Follow-ups</h2><div class="card">${a.map(v=>`<div class="item"><div class="row"><span><b>${esc(v.doctor)}</b><br><span class="muted">${esc(v.hospital)} • ${esc(v.route)}</span></span><span class="pill">${v.next<t?'Overdue':v.next===t?'Today':esc(v.next)}</span></div><div class="muted" style="margin-top:5px">${esc(v.feedback||'No feedback')}</div></div>`).join('')||'<div class="empty">No follow-ups recorded.</div>'}</div>`}
function reports(){nav('navreports');const opts=(a,p)=>'<option value="">'+p+'</option>'+uniq(a).sort().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');el('main').innerHTML=`<h2>Reports & Analytics</h2><div class="card"><h3>Report Filters</h3><div class="grid2"><div><label>From Date</label><input id="rfFrom" type="date"></div><div><label>To Date</label><input id="rfTo" type="date"></div><div><label>District</label><select id="rfDistrict">${opts(db.districts,'All Districts')}</select></div><div><label>Route</label><select id="rfRoute"><option value="">All Routes</option></select></div><div><label>Area</label><select id="rfArea"><option value="">All Areas</option></select></div><div><label>Hospital / Clinic</label><select id="rfHospital">${opts(db.hospitals.map(h=>h.name),'All Hospitals / Clinics')}</select></div><div><label>Doctor</label><select id="rfDoctor">${opts(db.doctors.map(d=>d.name),'All Doctors')}</select></div><div><label>Product</label><select id="rfProduct">${opts(db.products.map(p=>p.name),'All Products')}</select></div></div><div class="row" style="margin-top:10px"><button class="small" onclick="applyReports()">Apply</button><button class="small secondary" onclick="clearReportFilters()">Clear</button><button class="small" onclick="exportReportCSV()">Export Report</button></div></div><div id="reportOutput"></div>`;const n=new Date();el('rfFrom').value=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-01`;el('rfTo').value=today();el('rfDistrict').addEventListener('change',updateReportFilters);el('rfRoute').addEventListener('change',updateReportAreaFilters);el('rfArea').addEventListener('change',updateReportAreaFilters);updateReportFilters();applyReports()}
function updateReportFilters(){const d=el('rfDistrict')?.value||'',rEl=el('rfRoute');if(!rEl)return;const routes=uniq([...db.routes.filter(r=>!d||!r.district||r.district===d).map(r=>r.name),...db.visits.filter(v=>!d||v.district===d).map(v=>v.route)]).sort(),old=rEl.value;rEl.innerHTML='<option value="">All Routes</option>'+routes.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('');if(routes.includes(old))rEl.value=old;updateReportAreaFilters()}
function updateReportAreaFilters(){const d=el('rfDistrict')?.value||'',r=el('rfRoute')?.value||'',aEl=el('rfArea'),hEl=el('rfHospital'),docEl=el('rfDoctor');if(!aEl||!hEl||!docEl)return;const areas=uniq([...db.areas.filter(a=>(!d||!a.district||a.district===d)&&(!r||!a.route||a.route===r)).map(a=>a.name),...db.visits.filter(v=>(!d||v.district===d)&&(!r||v.route===r)).map(v=>v.area)]).sort(),oldA=aEl.value;aEl.innerHTML='<option value="">All Areas</option>'+areas.filter(Boolean).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(areas.includes(oldA))aEl.value=oldA;const area=aEl.value||'',hs=db.hospitals.filter(h=>(!d||h.district===d)&&(!r||h.route===r)&&(!area||h.area===area)),hNames=uniq(hs.map(h=>h.name)).sort(),oldH=hEl.value;hEl.innerHTML='<option value="">All Hospitals / Clinics</option>'+hNames.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(hNames.includes(oldH))hEl.value=oldH;const hospital=hEl.value||'',ds=db.doctors.filter(x=>(!d||x.district===d)&&(!r||x.route===r)&&(!area||x.hospitalId&&hs.some(h=>String(h.id)===String(x.hospitalId)&&h.area===area))&&(!hospital||x.hospital===hospital)),dNames=uniq(ds.map(x=>x.name)).sort(),oldD=docEl.value;docEl.innerHTML='<option value="">All Doctors</option>'+dNames.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(dNames.includes(oldD))docEl.value=oldD}
function getReportVisits(){const from=el('rfFrom')?.value||'',to=el('rfTo')?.value||'',district=el('rfDistrict')?.value||'',route=el('rfRoute')?.value||'',area=el('rfArea')?.value||'',hospital=el('rfHospital')?.value||'',doctor=el('rfDoctor')?.value||'',product=el('rfProduct')?.value||'';return db.visits.filter(v=>{const date=String(v.date||'').slice(0,10),ps=Array.isArray(v.products)?v.products.map(String):[];return(!from||date>=from)&&(!to||date<=to)&&(!district||v.district===district)&&(!route||v.route===route)&&(!area||v.area===area)&&(!hospital||v.hospital===hospital)&&(!doctor||v.doctor===doctor)&&(!product||ps.includes(product))})}
function by(arr,fn){const o={};arr.forEach(x=>{const k=fn(x)||'Unknown';o[k]=(o[k]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function reportTable(title,data,label){const total=data.reduce((n,x)=>n+x[1],0);return `<div class="card"><h3>${title}</h3>${data.length?`<div style="overflow:auto"><table><thead><tr><th>${label}</th><th>Visits</th><th>%</th></tr></thead><tbody>${data.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td><td>${total?((x[1]/total)*100).toFixed(1):'0.0'}%</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No data for selected filters.</div>'}</div>`}
function applyReports(){const vs=getReportVisits(),t=today(),uniqCount=a=>new Set(a.filter(Boolean)).size,days=uniqCount(vs.map(v=>v.date)),avg=days?(vs.length/days).toFixed(1):'0.0',detailing={},samples={};vs.forEach(v=>{(Array.isArray(v.products)?v.products:[]).forEach(p=>detailing[p]=(detailing[p]||0)+1);normalizeSamples(v.samples).forEach(x=>samples[x.product]=(samples[x.product]||0)+x.qty)});const fb={Positive:0,Neutral:0,Negative:0,Other:0};vs.forEach(v=>{const f=String(v.feedback||'').toLowerCase();if(!f)return;if(/positive|good|interested|satisfied|yes/.test(f))fb.Positive++;else if(/negative|poor|not interested|issue|no/.test(f))fb.Negative++;else if(/neutral|okay|average/.test(f))fb.Neutral++;else fb.Other++});const follow=vs.filter(v=>v.next).sort((a,b)=>String(a.next).localeCompare(String(b.next))),overdue=follow.filter(v=>v.next<t).length,due=follow.filter(v=>v.next===t).length,upcoming=follow.filter(v=>v.next>t).length,detailRows=vs.slice().sort(sortVisits),routeRows=by(vs,v=>v.route),doctorRows=by(vs,v=>v.doctor),hospitalRows=by(vs,v=>v.hospital),areaRows=by(vs,v=>v.area),districtRows=by(vs,v=>v.district),dailyRows=by(vs,v=>v.date);
 const detailTable=detailRows.length?`<div class="card"><h3>Doctor Visit Details — Products, Samples & Feedback</h3><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Route / Area</th><th>Hospital / Clinic</th><th>Doctor</th><th>Products</th><th>Samples</th><th>Feedback</th><th>Follow-up</th><th>Remarks</th></tr></thead><tbody>${detailRows.map(v=>`<tr><td>${esc(v.date||'')}<br><span class="muted">${esc(v.time||'')}</span></td><td><b>${esc(v.route||'—')}</b><br><span class="muted">${esc(v.area||'—')}</span></td><td>${esc(v.hospital||'—')}</td><td><b>${esc(v.doctor||'—')}</b></td><td>${esc(Array.isArray(v.products)?v.products.join(', '):'—')}</td><td>${esc(normalizeSamples(v.samples).map(x=>x.product+' x'+x.qty).join(', ')||'—')}</td><td>${esc(v.feedback||'—')}</td><td>${esc(v.next||'—')}</td><td>${esc(v.remarks||'—')}</td></tr>`).join('')}</tbody></table></div></div>`:'<div class="card"><div class="empty">No visits found for selected filters.</div></div>';
 const routeDetail=routeRows.length?`<div class="card"><h3>Route-wise Detailed Visits</h3><div style="overflow:auto"><table><thead><tr><th>Route</th><th>Visits</th><th>Doctors</th><th>Hospitals</th><th>Areas</th><th>Products</th><th>Sample Qty</th></tr></thead><tbody>${routeRows.map(([route,n])=>{const rv=vs.filter(v=>(v.route||'Unknown')===route),qty=rv.reduce((s,v)=>s+normalizeSamples(v.samples).reduce((a,x)=>a+x.qty,0),0),prod=uniqCount(rv.flatMap(v=>Array.isArray(v.products)?v.products:[]));return `<tr><td><b>${esc(route)}</b></td><td>${n}</td><td>${uniqCount(rv.map(v=>v.doctor))}</td><td>${uniqCount(rv.map(v=>v.hospital))}</td><td>${uniqCount(rv.map(v=>v.area))}</td><td>${prod}</td><td>${qty}</td></tr>`}).join('')}</tbody></table></div></div>`:'<div class="card"><h3>Route-wise Detailed Visits</h3><div class="empty">No route data found.</div></div>';
 const followDetail=follow.length?`<div class="card"><h3>Follow-up Details</h3><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Doctor</th><th>Hospital</th><th>Route</th><th>Feedback</th><th>Status</th></tr></thead><tbody>${follow.slice(0,200).map(v=>`<tr><td>${esc(v.next)}</td><td>${esc(v.doctor)}</td><td>${esc(v.hospital)}</td><td>${esc(v.route)}</td><td>${esc(v.feedback||'—')}</td><td>${v.next<t?'Overdue':v.next===t?'Today':'Upcoming'}</td></tr>`).join('')}</tbody></table></div></div>`:'<div class="card"><h3>Follow-up Details</h3><div class="empty">No follow-ups in selected visits.</div></div>';
 el('reportOutput').innerHTML=`<div class="stats"><div class="stat"><b>${vs.length}</b><span>Total Visits</span></div><div class="stat"><b>${uniqCount(vs.map(v=>v.doctor))}</b><span>Doctors Visited</span></div><div class="stat"><b>${uniqCount(vs.map(v=>v.route))}</b><span>Routes Covered</span></div><div class="stat"><b>${uniqCount(vs.map(v=>v.hospital))}</b><span>Hospitals / Clinics</span></div><div class="stat"><b>${days}</b><span>Active Days</span></div><div class="stat"><b>${avg}</b><span>Visits / Active Day</span></div></div><div class="card"><h3>Follow-up Summary</h3><div class="stats"><div class="stat"><b>${overdue}</b><span>Overdue</span></div><div class="stat"><b>${due}</b><span>Due Today</span></div><div class="stat"><b>${upcoming}</b><span>Upcoming</span></div><div class="stat"><b>${follow.length}</b><span>Total Follow-ups</span></div></div></div><div class="card"><h3>Feedback Summary</h3><div class="stats"><div class="stat"><b>${fb.Positive}</b><span>Positive / Interested</span></div><div class="stat"><b>${fb.Neutral}</b><span>Neutral</span></div><div class="stat"><b>${fb.Negative}</b><span>Negative / Issue</span></div><div class="stat"><b>${fb.Other}</b><span>Other</span></div></div></div>${reportTable('Route-wise Visits',routeRows,'Route')}${routeDetail}${reportTable('Area-wise Visits',areaRows,'Area')}${reportTable('Doctor-wise Visits',doctorRows,'Doctor')}${reportTable('Hospital / Clinic-wise Visits',hospitalRows,'Hospital / Clinic')}${reportTable('District-wise Visits',districtRows,'District')}${reportTable('Daily Visit Trend',dailyRows,'Date')}<div class="card"><h3>Product Detailing Counts</h3>${Object.keys(detailing).length?`<div style="overflow:auto"><table><thead><tr><th>Product</th><th>Visits</th></tr></thead><tbody>${Object.entries(detailing).sort((a,b)=>b[1]-a[1]).map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No products selected in visits.</div>'}</div><div class="card"><h3>Samples Given</h3>${Object.keys(samples).length?`<div style="overflow:auto"><table><thead><tr><th>Sample Product</th><th>Total Quantity</th></tr></thead><tbody>${Object.entries(samples).sort((a,b)=>b[1]-a[1]).map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No samples recorded.</div>'}</div>${detailTable}${followDetail}`}
function clearReportFilters(){['rfFrom','rfTo','rfDistrict','rfRoute','rfArea','rfHospital','rfDoctor','rfProduct'].forEach(id=>{if(el(id))el(id).value=''});updateReportFilters();applyReports()}
function exportReportCSV(){const vs=getReportVisits();if(!vs.length)return alert('No visits match the selected filters.');const rows=[['Date','Time','District','Route','Area','Hospital/Clinic','Doctor','Products','Samples','Feedback','Follow-up','Remarks']];vs.forEach(v=>rows.push([v.date||'',v.time||'',v.district||'',v.route||'',v.area||'',v.hospital||'',v.doctor||'',(v.products||[]).join(' | '),normalizeSamples(v.samples).map(x=>x.product+' x'+x.qty).join(' | '),v.feedback||'',v.next||'',v.remarks||'']));downloadText('ALPHA_NATURAL_FIELD_CRM_Filtered_Report.csv',rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8')}
function csvCell(x){return '"'+String(x??'').replaceAll('"','""')+'"'}
function exportCSV(){const rows=[['Date','Time','District','Route','Area','Hospital/Clinic','Doctor','Products','Samples','Feedback','Follow-up','Remarks']];db.visits.forEach(v=>rows.push([v.date,v.time,v.district,v.route,v.area,v.hospital,v.doctor,(v.products||[]).join(' | '),normalizeSamples(v.samples).map(x=>x.product+' x'+x.qty).join(' | '),v.feedback,v.next,v.remarks]));downloadText('ALPHA_NATURAL_FIELD_CRM_Visits.csv',rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8')}
function backup(){downloadText('ALPHA_NATURAL_FIELD_CRM_Backup.json',JSON.stringify(db,null,2),'application/json;charset=utf-8')}
function downloadText(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.addEventListener('load',()=>{if(!localStorage.getItem(KEY))save();home()});
</script>
